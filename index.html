/* ─── PNG 저장 ───────────────────────────────────────────
   화면을 베끼지 않고, 지금 서사를 캔버스에 다시 그려 한 장으로 뽑는다. */
function rrect(g, x, y, w, h, r){
  g.beginPath();
  g.moveTo(x+r, y);       g.lineTo(x+w-r, y);   g.quadraticCurveTo(x+w, y, x+w, y+r);
  g.lineTo(x+w, y+h-r);   g.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  g.lineTo(x+r, y+h);     g.quadraticCurveTo(x, y+h, x, y+h-r);
  g.lineTo(x, y+r);       g.quadraticCurveTo(x, y, x+r, y);
  g.closePath();
}
function wrapLines(g, text, maxW){
  const out = [];
  String(text == null ? "" : text).split("\n").forEach(par => {
    if(!par){ out.push(""); return; }
    let line = "";
    for(const ch of par){
      if(line && g.measureText(line + ch).width > maxW){ out.push(line); line = ch; }
      else line += ch;
    }
    out.push(line);
  });
  return out;
}
function loadImg(src){
  return new Promise(res => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = src; });
}
// CSS의 object-fit:cover + 확대·이동을 그대로 캔버스에 옮긴다
function drawPan(g, im, x, y, w, h, o, screenW){
  const k = screenW ? w / screenW : 1;
  const base = Math.max(w / im.width, h / im.height) * (o.iz || 1);
  const dw = im.width * base, dh = im.height * base;
  g.save();
  rrect(g, x, y, w, h, 12); g.clip();
  g.fillStyle = "#FFFFFF"; g.fillRect(x, y, w, h);
  g.drawImage(im, x + w/2 - dw/2 + (o.ix || 0) * k, y + h/2 - dh/2 + (o.iy || 0) * k, dw, dh);
  g.restore();
}

// 프로필 카드 — 사진(둥근 정사각형) 왼쪽, 이름·태그·항목표 오른쪽
function profileCardLayout(ms, c, cardW, F, photo){
  const PADC = 18, kvLabel = 84;
  const infoW = cardW - PADC*2 - photo - 16;
  ms.font = "14px " + F;
  const vw = infoW - kvLabel - 24;
  const rows = c.info.map(r => ({k:r.k || "", lines:wrapLines(ms, r.v || "—", vw)}));
  const tags = (c.tags || "").split(/[,\s]+/).filter(Boolean);
  ms.font = "13.5px " + F;
  const line = c.line ? wrapLines(ms, c.line, infoW).slice(0, 2) : [];
  const kvH = 14 + rows.reduce((n, r) => n + r.lines.length*22 + 8, 0) + 6;
  const infoH = 30 + (line.length ? line.length*20 + 6 : 0) + (tags.length ? 30 : 0) + kvH;
  return {rows:rows, tags:tags, line:line, kvH:kvH, infoW:infoW, infoH:infoH,
          pad:PADC, kvLabel:kvLabel, photo:photo,
          h: PADC + Math.max(photo, infoH) + PADC};
}
function drawProfileCard(g, ms, side, c, x, y, cardW, L, C, F, img){
  g.fillStyle = C.surface;
  rrect(g, x, y, cardW, L.h, 16); g.fill();
  g.strokeStyle = C.rule; g.lineWidth = 1; g.stroke();

  if(img){
    const el = document.querySelector('.slot.face[data-slot="' + side + '"]');
    drawPan(g, img, x + L.pad, y + L.pad, L.photo, L.photo, c,
            (el && el.getBoundingClientRect().width) || L.photo);
  }else{
    g.fillStyle = C.field;
    rrect(g, x + L.pad, y + L.pad, L.photo, L.photo, 16); g.fill();
  }

  const ix = x + L.pad + L.photo + 16;
  let ty = y + L.pad;
  g.fillStyle = c.color; g.font = "700 22px " + F;
  g.fillText(short(c.name, 12), ix, ty + 20);
  const nw = g.measureText(short(c.name, 12)).width;
  if(c.age){
    g.fillStyle = C.ink3; g.font = "14px " + F;
    g.fillText(c.age, ix + nw + 10, ty + 20);
  }
  ty += 30;
  if(L.line.length){
    g.fillStyle = C.ink3; g.font = "13.5px " + F;
    L.line.forEach((l, i) => g.fillText(l, ix, ty + 14 + i*20));
    ty += L.line.length*20 + 6;
  }
  if(L.tags.length){
    let cx = ix;
    g.font = "12px " + F;
    L.tags.forEach(t => {
      const label = t[0] === "#" ? t : "#" + t;
      const tw = g.measureText(label).width + 16;
      if(cx + tw > ix + L.infoW) return;
      g.fillStyle = C.field; rrect(g, cx, ty, tw, 22, 6); g.fill();
      g.strokeStyle = C.ruleSoft; g.stroke();
      g.fillStyle = C.ink2; g.fillText(label, cx + 8, ty + 15);
      cx += tw + 5;
    });
    ty += 30;
  }
  g.fillStyle = C.field;
  rrect(g, ix, ty, L.infoW, L.kvH, 12); g.fill();
  g.strokeStyle = C.ruleSoft; g.stroke();
  let ky = ty + 14;
  L.rows.forEach(r => {
    g.fillStyle = C.ink2; g.font = "600 13px " + F;
    g.fillText(r.k, ix + 12, ky + 15);
    g.fillStyle = C.ink; g.font = "14px " + F;
    r.lines.forEach((l, i) => g.fillText(l, ix + 12 + L.kvLabel, ky + 15 + i*22));
    ky += r.lines.length*22 + 8;
  });
}

// 사이드의 감정 곡선을 PNG 안에도 한 장으로 그린다
function drawCurveCard(g, x, y, w, h, bs, p, ts, C, F){
  g.fillStyle = C.surface;
  rrect(g, x, y, w, h, 12); g.fill();
  g.strokeStyle = C.rule; g.lineWidth = 1; g.stroke();

  g.fillStyle = C.ink3; g.font = "600 13px " + F;
  g.fillText("감정 곡선", x + 20, y + 27);

  g.textAlign = "right";                                  // 범례 — 두 사람의 색
  let lx = x + w - 20;
  [[short(p.b.name,10), p.b.color], [short(p.a.name,10), p.a.color]].forEach(pair2 => {
    g.font = "12.5px " + F; g.fillStyle = C.ink2;
    g.fillText(pair2[0], lx, y + 27);
    const tw = g.measureText(pair2[0]).width;
    g.fillStyle = pair2[1];
    rrect(g, lx - tw - 15, y + 18, 10, 10, 3); g.fill();
    lx -= tw + 30;
  });
  g.textAlign = "left";

  const px = x + 24, pw = w - 48, pt = y + 46, ph = h - 46 - 36;
  const X = i => bs.length < 2 ? px + pw/2 : px + i * pw / (bs.length - 1);
  const Y = v => pt + (100 - v)/100 * ph;

  g.strokeStyle = C.ruleSoft; g.lineWidth = 1;
  g.beginPath(); g.moveTo(px, pt + ph); g.lineTo(px + pw, pt + ph); g.stroke();
  g.save(); g.setLineDash([4,4]); g.globalAlpha = .7;
  g.beginPath(); g.moveTo(px, pt + ph/2); g.lineTo(px + pw, pt + ph/2); g.stroke();
  g.restore();

  bs.forEach((b, i) => {                                  // 막이 바뀌는 자리
    if(i && b.actId !== bs[i-1].actId){
      const tx = (X(i-1) + X(i)) / 2;
      g.save(); g.setLineDash([3,4]); g.globalAlpha = .45; g.strokeStyle = C.ink3;
      g.beginPath(); g.moveTo(tx, pt); g.lineTo(tx, pt + ph); g.stroke(); g.restore();
    }
  });
  ts.forEach(t => {
    const idx = bs.map((b,i) => b.actId === t.id ? i : -1).filter(i => i >= 0);
    if(!idx.length) return;
    const mid = (X(idx[0]) + X(idx[idx.length-1])) / 2;
    g.fillStyle = t.color; g.font = "600 12.5px " + F; g.textAlign = "center";
    g.fillText(t.label + " " + t.name.split(" · ")[0], mid, pt + ph + 24);
    g.textAlign = "left";
  });

  const series = side => {
    const o = [];
    bs.forEach((b,i) => { if(b.who === side || b.who === "both") o.push([X(i), Y(b.tension)]); });
    return o;
  };
  const stroke = (pts, col) => {
    if(!pts.length) return;
    if(pts.length > 1){
      g.strokeStyle = col; g.lineWidth = 2.4; g.lineCap = "round";
      g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
      for(let i=1;i<pts.length;i++){
        const a = pts[i-1], b2 = pts[i], mx = (a[0] + b2[0]) / 2;
        g.bezierCurveTo(mx, a[1], mx, b2[1], b2[0], b2[1]);
      }
      g.stroke();
    }
    g.fillStyle = col;
    pts.forEach(q => { g.beginPath(); g.arc(q[0], q[1], 3.4, 0, Math.PI*2); g.fill(); });
  };
  stroke(series("a"), p.a.color);
  stroke(series("b"), p.b.color);
}

/* 상세버전 PNG — 프로필 · 감정 곡선 · 두 레인의 블럭 */
async function exportPNG(){
  const btn = $("#pngBtn");
  btn.disabled = true;
  notify("PNG 만드는 중…");
  try{
    try{ await document.fonts.ready; }catch(e){}
    const p = pair(), u = uni(), ts = acts(), bs = blocks();
    const v = k => getComputedStyle(document.documentElement).getPropertyValue(k).trim();
    const C = {paper:v("--paper"), surface:v("--surface"), field:v("--field"),
               ink:v("--ink"), ink2:v("--ink-2"), ink3:v("--ink-3"),
               rule:v("--rule"), ruleSoft:v("--rule-soft")};
    const F = '"IBM Plex Sans KR","Apple SD Gothic Neo",sans-serif';
    const W = 1240, M = 44, GAP = 60, PAD = 14, SHOT_H = 178;
    const laneW = Math.round((W - M*2 - GAP) / 2);
    const bothW = Math.round(laneW * 1.36);

    const im = {};
    const jobs = [];
    if(u.cover) jobs.push(loadImg(u.cover).then(x => im.cover = x));
    ["a","b"].forEach(s => { if(p[s].img) jobs.push(loadImg(p[s].img).then(x => im[s] = x)); });
    bs.forEach(b => { if(b.img) jobs.push(loadImg(b.img).then(x => im[b.id] = x)); });
    await Promise.all(jobs);

    const ms = document.createElement("canvas").getContext("2d");
    const wid = b => b.who === "both" ? bothW : laneW;
    function layout(b){
      const inner = wid(b) - PAD*2 - 6;
      ms.font = "600 17px " + F;
      const t = wrapLines(ms, b.title || "(제목 없음)", inner);
      ms.font = "14.5px " + F;
      const body = b.body ? wrapLines(ms, b.body, inner) : [];
      const shot = b.img && im[b.id] ? SHOT_H + 10 : 0;
      return {t:t, body:body, shot:shot,
              h: PAD + t.length*24 + shot + (body.length ? body.length*21 + 8 : 0) + 20 + PAD};
    }
    const lay = {};
    bs.forEach(b => lay[b.id] = layout(b));

    ms.font = "700 34px " + F;
    const headTitle = wrapLines(ms, short(p.a.name,14) + " × " + short(p.b.name,14), W - M*2);
    ms.font = "15px " + F;
    const noteLines = u.note ? wrapLines(ms, u.note, W - M*2 - 240) : [];
    const coverH = im.cover ? Math.min(430, Math.round((W - M*2) * im.cover.height / im.cover.width)) : 0;
    const noteN = Math.min(noteLines.length, 4);
    const cardW = Math.round((W - M*2 - 20) / 2);
    const PC = {a:profileCardLayout(ms, p.a, cardW, F, 150),
                b:profileCardLayout(ms, p.b, cardW, F, 150)};
    const cardH = Math.max(PC.a.h, PC.b.h);
    const headH = M + (coverH ? coverH + 22 : 0) + headTitle.length*40 + 30 +
                  cardH + (noteN ? noteN*23 + 16 : 0) + 22;

    const curveH = bs.length >= 2 ? 214 : 0;
    let H = headH + (curveH ? curveH + 20 : 0);
    ts.forEach((t, i) => {
      const list = bs.filter(b => b.actId === t.id);
      H += 74 + 18;                                     // 막 머리 + 사이
      list.forEach(b => H += lay[b.id].h + 16);
      if(!list.length) H += 10;
      if(i < ts.length - 1) H += 34;                    // 이음선
    });
    H += 54;

    const S = (H * 2 > 15000) ? 1 : 2;
    const cv = document.createElement("canvas");
    cv.width = W * S; cv.height = H * S;
    const g = cv.getContext("2d");
    g.scale(S, S);
    g.textBaseline = "alphabetic";
    g.fillStyle = C.paper || "#FFFFFF";
    g.fillRect(0, 0, W, H);

    let y = M;
    if(coverH){
      g.save();
      rrect(g, M, y, W - M*2, coverH, 14); g.clip();
      g.fillStyle = "#FFFFFF"; g.fillRect(M, y, W - M*2, coverH);
      const s = Math.min((W - M*2) / im.cover.width, coverH / im.cover.height);
      g.drawImage(im.cover, M + (W - M*2 - im.cover.width*s)/2, y + (coverH - im.cover.height*s)/2,
                  im.cover.width*s, im.cover.height*s);
      g.restore();
      g.strokeStyle = C.rule; g.lineWidth = 1;
      rrect(g, M + .5, y + .5, W - M*2 - 1, coverH - 1, 14); g.stroke();
      y += coverH + 22;
    }
    g.fillStyle = C.ink; g.font = "700 34px " + F;
    headTitle.forEach(l => { g.fillText(l, M, y + 30); y += 40; });
    g.fillStyle = C.ink3; g.font = "500 15px " + F;
    g.fillText(u.name + (u.kind === "au" ? "  ·  AU" : "  ·  본편"), M, y + 16);
    y += 30;

    const rowY = y;
    [["a", M], ["b", M + cardW + 20]].forEach(pairXY => {
      const side = pairXY[0], x = pairXY[1];
      drawProfileCard(g, ms, side, p[side], x, rowY, cardW, PC[side], C, F, im[side]);
    });
    if(noteN){
      g.fillStyle = C.ink2; g.font = "15px " + F;
      noteLines.slice(0, noteN).forEach((l, i) => g.fillText(l, M, rowY + cardH + 22 + i*23));
    }
    y = headH;
    if(curveH){
      drawCurveCard(g, M, y, W - M*2, curveH, bs, p, ts, C, F);
      y += curveH + 20;
    }

    // 막과 블럭
    ts.forEach((t, ai) => {
      const list = bs.filter(b => b.actId === t.id);
      g.fillStyle = C.surface;
      rrect(g, M, y, W - M*2, 62, 12); g.fill();
      g.strokeStyle = C.rule; g.lineWidth = 1; g.stroke();
      g.fillStyle = t.color;
      rrect(g, M, y, 5, 62, 3); g.fill();
      rrect(g, M + 16, y + 10, 42, 42, 10); g.fill();
      g.fillStyle = "#FFFFFF"; g.font = "700 21px " + F;
      g.textAlign = "center";
      g.fillText(t.label, M + 37, y + 39);
      g.textAlign = "left";
      g.fillStyle = C.ink; g.font = "700 18px " + F;
      g.fillText(t.name, M + 72, y + 28);
      g.fillStyle = C.ink3; g.font = "13px " + F;
      g.fillText(t.desc, M + 72, y + 48);
      g.fillStyle = C.ink3; g.font = "600 13px " + F;
      g.textAlign = "right";
      g.fillText(list.length + "블럭", W - M - 16, y + 38);
      g.textAlign = "left";
      const stackTop = y + 62;
      y = stackTop + 18;

      const stackBottom = y + list.reduce((s,b) => s + lay[b.id].h + 16, 0) - 16;
      g.save(); g.globalAlpha = .26; g.fillStyle = t.color;
      rrect(g, W/2 - 3, stackTop, 6, Math.max(24, stackBottom - stackTop), 3); g.fill();
      g.restore();

      list.forEach(b => {
        const L = lay[b.id], w = wid(b);
        const x = b.who === "a" ? M : b.who === "b" ? M + laneW + GAP : Math.round((W - bothW)/2);
        const col = b.who === "a" ? p.a.color : b.who === "b" ? p.b.color : t.color;
        if(b.who !== "both"){
          g.save(); g.globalAlpha = .45; g.fillStyle = t.color;
          const sx = b.who === "a" ? x + w : W/2, sw = b.who === "a" ? W/2 - (x + w) : x - W/2;
          g.fillRect(sx, y + L.h/2 - 3, sw, 6);
          g.restore();
        }
        g.fillStyle = C.surface;
        rrect(g, x, y, w, L.h, 12); g.fill();
        g.strokeStyle = C.rule; g.lineWidth = 1; g.stroke();
        g.fillStyle = col;
        rrect(g, x, y, 5, L.h, 3); g.fill();

        let ty = y + PAD + 18;
        g.fillStyle = C.ink; g.font = "600 17px " + F;
        L.t.forEach(l => { g.fillText(l, x + PAD + 6, ty); ty += 24; });
        if(L.shot){
          const el = document.querySelector('.slot.shot[data-shot="' + b.id + '"]');
          drawPan(g, im[b.id], x + PAD + 6, ty - 14, w - PAD*2 - 6, SHOT_H, b,
                  (el && el.getBoundingClientRect().width) || 460);
          ty += SHOT_H - 4;
        }
        if(L.body.length){
          ty += 8;
          g.fillStyle = C.ink2; g.font = "14.5px " + F;
          L.body.forEach(l => { g.fillText(l, x + PAD + 6, ty); ty += 21; });
        }
        const who = b.who === "a" ? short(p.a.name,8) : b.who === "b" ? short(p.b.name,8) : "함께";
        g.fillStyle = C.ink3; g.font = "12.5px " + F;
        g.fillText(who + (b.tag ? "  ·  " + b.tag : "") + "  ·  감정 " + b.tension, x + PAD + 6, ty + 12);
        const bw = 96, bx = x + w - PAD - 6 - bw;
        g.fillStyle = C.ruleSoft; rrect(g, bx, ty + 5, bw, 6, 3); g.fill();
        g.fillStyle = col; rrect(g, bx, ty + 5, Math.max(4, bw * b.tension/100), 6, 3); g.fill();

        y += L.h + 16;
      });
      if(!list.length) y += 10;

      if(ai < ts.length - 1){
        const grd = g.createLinearGradient(0, y, 0, y + 34);
        grd.addColorStop(0, t.color); grd.addColorStop(1, ts[ai+1].color);
        g.fillStyle = grd;
        rrect(g, W/2 - 3, y, 6, 26, 3); g.fill();
        g.fillStyle = ts[ai+1].color;
        g.beginPath(); g.moveTo(W/2 - 8, y + 24); g.lineTo(W/2 + 8, y + 24); g.lineTo(W/2, y + 34); g.fill();
        y += 34;
      }
    });

    g.fillStyle = C.ink3; g.font = "12.5px " + F;
    g.fillText("@whitecotchi", M, H - 22);
    g.textAlign = "right";
    g.fillText(new Date().toLocaleDateString("ko-KR"), W - M, H - 22);
    g.textAlign = "left";

    const name = (short(p.a.name,8) + "×" + short(p.b.name,8) + " " + u.name).replace(/[\\/:*?"<>|]/g, "");
    await new Promise(res => cv.toBlob(blob => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = name + ".png";
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      notify("PNG로 저장했습니다");
      res();
    }, "image/png"));
  }catch(err){
    notify("PNG를 만들지 못했습니다");
  }finally{
    btn.disabled = false;
  }
}

/* 단순버전 PNG — 인물 카드 → 페어 이미지·서사 소개 → 두 열의 서사 */
async function exportSimplePNG(){
  const btn = $("#pngBtn");
  btn.disabled = true;
  notify("PNG 만드는 중…");
  try{
    try{ await document.fonts.ready; }catch(e){}
    const p = pair(), u = uni(), ts = acts(), bs = blocks();
    const v = k => getComputedStyle(document.documentElement).getPropertyValue(k).trim();
    const C = {paper:v("--paper"), surface:v("--surface"), field:v("--field"),
               ink:v("--ink"), ink2:v("--ink-2"), ink3:v("--ink-3"),
               rule:v("--rule"), ruleSoft:v("--rule-soft")};
    const F = '"IBM Plex Sans KR","Apple SD Gothic Neo",sans-serif';
    const W = 1180, M = 44, GAP = 28, SHOT_H = 200, RAIL = 22, PHOTO = 168;
    const colW = Math.round((W - M*2 - GAP) / 2);
    const colX = [M, M + colW + GAP];
    const fullW = W - M*2;

    const img = {};
    const jobs = [];
    if(u.cover) jobs.push(loadImg(u.cover).then(x => img.cover = x));
    ["a","b"].forEach(s => { if(p[s].img) jobs.push(loadImg(p[s].img).then(x => img[s] = x)); });
    bs.forEach(b => { if(b.img) jobs.push(loadImg(b.img).then(x => img[b.id] = x)); });
    await Promise.all(jobs);

    const ms = document.createElement("canvas").getContext("2d");
    const PL = {a:profileCardLayout(ms, p.a, colW, F, PHOTO),
                b:profileCardLayout(ms, p.b, colW, F, PHOTO)};
    const cardH = Math.max(PL.a.h, PL.b.h);

    function entryLayout(b){
      const w = (b.who === "both" ? fullW : colW) - RAIL;
      ms.font = "700 18px " + F;
      const t = wrapLines(ms, b.title || "(제목 없음)", w);
      ms.font = "14.5px " + F;
      const body = b.body ? wrapLines(ms, b.body, w) : [];
      const shot = b.img && img[b.id] ? SHOT_H + 14 : 0;
      return {w:w, t:t, body:body, shot:shot, h: 22 + t.length*26 + shot + body.length*25 + 16};
    }
    const EL = {};
    bs.forEach(b => EL[b.id] = entryLayout(b));

    ms.font = "700 30px " + F;
    const uniTitle = wrapLines(ms, u.name, fullW);
    ms.font = "15px " + F;
    const noteLines = u.note ? wrapLines(ms, u.note, Math.min(fullW, 680)) : [];
    const coverH = img.cover ? Math.min(420, Math.round(fullW * img.cover.height / img.cover.width)) : 0;

    let H = M + cardH + 30 + (coverH ? coverH + 24 : 0) + 26 + uniTitle.length*38 +
            (noteLines.length ? noteLines.length*24 + 10 : 0) + 30;
    ts.forEach(t => {
      const list = bs.filter(b => b.actId === t.id);
      if(!list.length) return;
      H += 46;
      list.forEach(b => H += EL[b.id].h + 8);
    });
    H += 56;

    const S = (H * 2 > 15000) ? 1 : 2;
    const cv = document.createElement("canvas");
    cv.width = W * S; cv.height = H * S;
    const g = cv.getContext("2d");
    g.scale(S, S);
    g.fillStyle = C.paper || "#FFFFFF";
    g.fillRect(0, 0, W, H);

    // 인물 카드 두 장 — 왼쪽 A, 오른쪽 B
    let y = M;
    ["a","b"].forEach((side, ci) => {
      drawProfileCard(g, ms, side, p[side], colX[ci], y, colW, PL[side], C, F, img[side]);
    });
    y += cardH + 30;

    // 페어 이미지와 서사 소개
    if(coverH){
      g.save(); rrect(g, M, y, fullW, coverH, 14); g.clip();
      g.fillStyle = "#FFFFFF"; g.fillRect(M, y, fullW, coverH);
      const s = Math.min(fullW / img.cover.width, coverH / img.cover.height);
      g.drawImage(img.cover, M + (fullW - img.cover.width*s)/2, y + (coverH - img.cover.height*s)/2,
                  img.cover.width*s, img.cover.height*s);
      g.restore();
      g.strokeStyle = C.rule; g.lineWidth = 1;
      rrect(g, M + .5, y + .5, fullW - 1, coverH - 1, 14); g.stroke();
      y += coverH + 24;
    }
    g.textAlign = "center";
    g.fillStyle = C.ink3; g.font = "500 13px " + F;
    g.fillText(pairTitle(p), W/2, y + 14);
    y += 26;
    g.fillStyle = C.ink; g.font = "700 30px " + F;
    uniTitle.forEach(l => { g.fillText(l, W/2, y + 28); y += 38; });
    if(noteLines.length){
      g.fillStyle = C.ink2; g.font = "15px " + F;
      noteLines.forEach(l => { g.fillText(l, W/2, y + 20); y += 24; });
      y += 10;
    }
    g.textAlign = "left";
    y += 30;

    // 타임라인 — 세로선을 먼저 깔고 그 위에 점과 글을 얹는다
    const lineX = M + 6, storyTop = y;
    let storyH = 0;
    ts.forEach(t => {
      const list = bs.filter(b => b.actId === t.id);
      if(!list.length) return;
      storyH += 46;
      list.forEach(b => storyH += EL[b.id].h + 8);
    });

    ts.forEach(t => {
      const list = bs.filter(b => b.actId === t.id);
      if(!list.length) return;
      g.font = "600 12px " + F;
      const lw = g.measureText(t.label).width + 16;
      g.fillStyle = t.color;
      rrect(g, M, y, lw, 22, 5); g.fill();
      g.fillStyle = "#FFFFFF";
      g.fillText(t.label, M + 8, y + 15);
      g.fillStyle = t.color; g.font = "700 15px " + F;
      g.fillText(t.name, M + lw + 10, y + 15);
      const nw = g.measureText(t.name).width;
      g.strokeStyle = C.rule; g.lineWidth = 1;
      g.beginPath(); g.moveTo(M + lw + 10 + nw + 14, y + 11); g.lineTo(W - M, y + 11); g.stroke();
      y += 46;

      list.forEach(b => {
        const L = EL[b.id];
        const x = b.who === "both" ? M : colX[b.who === "a" ? 0 : 1];
        const col = b.who === "a" ? p.a.color : b.who === "b" ? p.b.color : t.color;
        const who = b.who === "a" ? short(p.a.name,10) : b.who === "b" ? short(p.b.name,10) : "함께";

        g.fillStyle = b.who === "both" ? col : C.rule;       // 왼쪽 세로 줄
        g.fillRect(x, y, 2, Math.max(20, L.h - 12));
        g.fillStyle = C.surface;                              // 점
        g.beginPath(); g.arc(x + 1, y + 11, 6.5, 0, Math.PI*2); g.fill();
        g.strokeStyle = col; g.lineWidth = 3; g.stroke();

        const tx = x + RAIL;
        let ty = y + 12;
        g.fillStyle = col; g.font = "600 12px " + F;
        g.fillText(who, tx, ty);
        const ww = g.measureText(who).width;
        if(b.tag){
          g.fillStyle = C.ink3; g.font = "12px " + F;
          g.fillText(b.tag, tx + ww + 10, ty);
        }
        ty += 24;
        g.fillStyle = C.ink; g.font = "700 18px " + F;
        L.t.forEach(l => { g.fillText(l, tx, ty); ty += 26; });
        if(L.shot){
          const el = document.querySelector('.slot.shot[data-shot="' + b.id + '"]');
          drawPan(g, img[b.id], tx, ty - 10, L.w, SHOT_H, b,
                  (el && el.getBoundingClientRect().width) || L.w);
          ty += SHOT_H + 6;
        }
        if(L.body.length){
          g.fillStyle = C.ink2; g.font = "14.5px " + F;
          L.body.forEach(l => { g.fillText(l, tx, ty + 6); ty += 25; });
        }
        y += L.h + 8;
      });
    });

    g.fillStyle = C.ink3; g.font = "12.5px " + F;
    g.fillText("@whitecotchi", M, H - 24);
    g.textAlign = "right";
    g.fillText(new Date().toLocaleDateString("ko-KR"), W - M, H - 24);
    g.textAlign = "left";

    const name = (short(p.a.name,8) + "×" + short(p.b.name,8) + " " + u.name + " 단순").replace(/[\\/:*?"<>|]/g, "");
    await new Promise(res => cv.toBlob(blob => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = name + ".png";
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      notify("PNG로 저장했습니다");
      res();
    }, "image/png"));
  }catch(err){
    notify("PNG를 만들지 못했습니다");
  }finally{
    btn.disabled = false;
  }
}
$("#pngBtn").addEventListener("click", () => state.mode === "simple" ? exportSimplePNG() : exportPNG());

/* ─── HTML 저장 ──────────────────────────────────────────
   지금 보고 있는 화면을 그대로, 사진까지 담은 파일 하나로 내려받는다. */
function exportHTML(){
  try{
    // 입력칸의 값은 outerHTML에 담기지 않으므로 속성으로 먼저 옮긴다
    document.querySelectorAll(".wrap input").forEach(el => {
      if(el.type !== "file") el.setAttribute("value", el.value);
    });
    document.querySelectorAll(".wrap textarea").forEach(el => { el.textContent = el.value; });

    const wrap = document.querySelector(".wrap").cloneNode(true);
    wrap.querySelectorAll(".toolbar, .tabs").forEach(n => n.remove());
    if(state.mode === "simple"){
      ["#pairCard", "#uniCard", ".cols"].forEach(sel => {
        const n = wrap.querySelector(sel); if(n) n.remove();
      });
    }else{
      const n = wrap.querySelector("#simple"); if(n) n.remove();
      const tips = wrap.querySelector(".side .tips");
      if(tips) tips.closest(".card").remove();
    }
    // 레인 버튼은 누구의 장면인지만 남긴다
    wrap.querySelectorAll(".whoseg").forEach(seg => {
      const on = seg.querySelector('[aria-pressed="true"]');
      const s2 = document.createElement("span");
      s2.className = "chip";
      s2.textContent = on ? on.textContent : "";
      seg.replaceWith(s2);
    });
    // 편집용 조작은 걷어낸다
    wrap.querySelectorAll("button, .tools, .grip, .bside, .actcmds, .addrow, .addact, .kvadd, .kvdel, .chipedit, .hint")
      .forEach(n => n.remove());
    wrap.querySelectorAll(".slot.empty, .simple-cover.empty, input[type=range], input[type=color]")
      .forEach(n => n.remove());
    wrap.querySelectorAll("input, textarea").forEach(el => {
      el.setAttribute("readonly", "");
      el.setAttribute("tabindex", "-1");
      el.removeAttribute("placeholder");           // 빈칸은 빈칸으로 남긴다
    });

    const links = [...document.querySelectorAll('link[rel*="icon"], link[rel="stylesheet"], link[rel="preconnect"]')]
      .map(l => l.outerHTML).join("\n");
    const css = [...document.querySelectorAll("style")].map(n => n.textContent).join("\n");
    const extra = "\n/* 저장본 — 읽기 전용 */\n" +
      "input,textarea{pointer-events:none}\n" +
      ".slot,.slot.face,.slot.shot{cursor:default}\n" +
      ".slot .tools{display:none}\n";
    const p2 = pair(), u = uni();
    const title = pairTitle(p2) + " — " + u.name;
    const rootStyle = (document.documentElement.getAttribute("style") || "").replace(/"/g, "&quot;");
    const bodyStyle = (document.body.getAttribute("style") || "").replace(/"/g, "&quot;");

    const doc = '<!doctype html>\n<html lang="ko" data-theme="' + state.theme + '" style="' + rootStyle + '">\n' +
      '<head>\n<meta charset="utf-8">\n' +
      '<meta name="viewport" content="width=device-width, initial-scale=1">\n' +
      '<title>' + esc(title) + '</title>\n' + links + '\n<style>' + css + extra + '</style>\n</head>\n' +
      '<body data-mode="' + state.mode + '" data-collapsed="' + (state.collapsed ? "1" : "0") + '" style="' + bodyStyle + '">\n' +
      wrap.outerHTML + '\n</body>\n</html>';

    const blob = new Blob([doc], {type:"text/html;charset=utf-8"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = (title + (state.mode === "simple" ? " 단순" : "")).replace(/[\\/:*?"<>|]/g, "") + ".html";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    notify("HTML로 저장했습니다");
  }catch(err){
    notify("HTML을 만들지 못했습니다");
  }
}
$("#htmlBtn").addEventListener("click", exportHTML);

render();
</script>
