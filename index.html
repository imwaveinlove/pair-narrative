<style>
/* ─── tokens ─────────────────────────────────────────────────
   관계도와 같은 팔레트. 백코가 바닥값, 나머지는 data-theme으로 덮는다. */
:root{
  --paper:#FFEAF3; --field:#FFF6FB; --surface:#FFFFFF;
  --ink:#4E2242; --ink-2:#7A4A6B; --ink-3:#9E6A8C;
  --rule:#F6C9E0; --rule-soft:#FBE0EE;
  --navy:#FF2D87; --navy-ink:#FFFFFF; --danger:#D6246B;
  --body-bg:radial-gradient(126% 92% at 50% 0%,#FFF5FB 0%,#FFE7F4 44%,#F0E4FC 100%);
  --shadow:0 1px 2px rgba(122,40,92,.07), 0 10px 26px -12px rgba(206,64,142,.36);
  --shadow-lift:0 2px 8px rgba(122,40,92,.12), 0 20px 44px -16px rgba(206,64,142,.46);
  --r:10px;
  color-scheme:light;   /* 슬라이더·스크롤바가 테마와 어긋나지 않게 */
}
:root[data-theme="blooming"]{
  --paper:#E4F2FA; --field:#F4FBFE; --surface:#FFFFFF;
  --ink:#123742; --ink-2:#376274; --ink-3:#55848F;
  --rule:#BEDFEC; --rule-soft:#DBEFF7;
  --navy:#0E90B4; --navy-ink:#FFFFFF; --danger:#C0374C;
  --body-bg:radial-gradient(126% 92% at 50% 0%,#F3FCFE 0%,#DCEFFA 44%,#D9F5EE 100%);
  --shadow:0 1px 2px rgba(18,55,66,.07), 0 10px 26px -12px rgba(30,120,150,.34);
  --shadow-lift:0 2px 8px rgba(18,55,66,.12), 0 20px 44px -16px rgba(30,120,150,.44);
}
:root[data-theme="bluelemon"]{
  --paper:#FDF1D2; --field:#FCFBF4; --surface:#FFFFFF;
  --ink:#263A44; --ink-2:#476574; --ink-3:#617F8C;
  --rule:#CFDFE4; --rule-soft:#E6EFF1;
  --navy:#1B7CA6; --navy-ink:#FFFFFF; --danger:#BF4437;
  --body-bg:linear-gradient(172deg,#FEF6E0 0%,#FCEBBE 26%,#DCEEE4 62%,#AFDAEB 100%);
  --shadow:0 1px 2px rgba(30,58,68,.07), 0 10px 26px -12px rgba(28,110,144,.34);
  --shadow-lift:0 2px 8px rgba(30,58,68,.12), 0 20px 44px -16px rgba(28,110,144,.44);
}
/* 그라데이션 — 두 색은 사용자가 고른다. 나머지 색은 그 두 색에서 계산해
   :root에 직접 얹히므로 여기에는 규칙이 없다. (applyTheme 참고) */

*,*::before,*::after{box-sizing:border-box}
body{
  margin:0; background:var(--body-bg); background-attachment:fixed; color:var(--ink);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px;border-radius:4px}

/* ─── shell ──────────────────────────────────────────────── */
.wrap{max-width:1240px;margin:0 auto;padding:28px 20px 64px;display:flex;flex-direction:column;gap:18px}
header.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:18px}
.brand{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.eyebrow{
  font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:500;
  letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);
}
.eyebrow.handle{text-transform:none;letter-spacing:.06em;font-size:12px}
h1{
  font-family:"Bricolage Grotesque","IBM Plex Sans KR",sans-serif;
  font-variation-settings:"wdth" 88,"opsz" 48;
  font-weight:700;font-size:clamp(30px,4.4vw,46px);line-height:1.02;
  margin:0;letter-spacing:-.02em;
}
.tagline{color:var(--ink-2);font-size:14px;max-width:54ch;margin:0}

.stats{display:flex;border:1px solid var(--rule);border-radius:var(--r);background:var(--surface);overflow:hidden}
.stat{padding:9px 16px;display:flex;flex-direction:column;gap:1px;min-width:78px}
.stat + .stat{border-left:1px solid var(--rule-soft)}
.stat .k{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.stat .v{font-family:"IBM Plex Mono",monospace;font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.stat .v small{font-size:11px;font-weight:400;color:var(--ink-3);margin-left:1px}

/* ─── toolbar ────────────────────────────────────────────── */
.toolbar{
  display:flex;flex-wrap:wrap;align-items:center;gap:10px;
  padding:10px 12px;background:var(--surface);
  border:1px solid var(--rule);border-radius:var(--r);
}
.btn{
  display:inline-flex;align-items:center;gap:7px;
  padding:7px 13px;background:var(--field);border:1px solid var(--rule);
  border-radius:8px;cursor:pointer;font-size:13.5px;font-weight:500;
  transition:background .12s, border-color .12s, transform .08s;
}
.btn:hover{background:var(--surface);border-color:var(--ink-3)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:12.5px}
.sep{width:1px;height:22px;background:var(--rule)}
.spacer{flex:1}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--field)}
.seg button{padding:7px 12px;background:transparent;border:0;cursor:pointer;font-size:13px;color:var(--ink-2)}
.seg button + button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink);font-weight:600}
.saved{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.gradpick{display:inline-flex;align-items:center;gap:4px}
.gradpick[hidden]{display:none}

/* ─── 탭 ─────────────────────────────────────────────────── */
.tabs{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tab{
  display:inline-flex;align-items:center;gap:8px;padding:7px 13px;
  background:var(--surface);border:1px solid var(--rule);border-radius:999px;
  cursor:pointer;font-size:13.5px;
}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tab .n{font-family:"IBM Plex Mono",monospace;font-size:11px;opacity:.7}
.tab .kind{
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.08em;
  border:1px solid currentColor;border-radius:4px;padding:0 4px;opacity:.6;
}
.tabs .lab{
  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-3);margin-right:2px;
}

/* ─── 페어 카드 ───────────────────────────────────────────── */
.pair{display:grid;grid-template-columns:minmax(0,1fr) 54px minmax(0,1fr);gap:14px;align-items:start}
.colorrow{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink-3)}
input[type=color]{
  -webkit-appearance:none;appearance:none;width:30px;height:24px;padding:0;
  background:transparent;border:1px solid var(--rule);border-radius:7px;cursor:pointer;
}
input[type=color]::-webkit-color-swatch-wrapper{padding:2px}
input[type=color]::-webkit-color-swatch{border:0;border-radius:5px}
input[type=color]::-moz-color-swatch{border:0;border-radius:5px}
.heart{display:grid;place-items:center;font-size:24px;color:var(--navy)}

/* ─── 이미지 자리 ─────────────────────────────────────────── */
.slot{
  position:relative;flex:none;display:grid;place-items:center;
  background:var(--surface);border:1px dashed var(--rule);border-radius:12px;
  cursor:pointer;overflow:hidden;color:var(--ink-3);font-size:11px;text-align:center;padding:4px;
}
.slot:hover{border-color:var(--c,var(--navy));color:var(--ink-2)}
.slot img{display:block}
.tools{position:absolute;top:5px;right:5px;display:none;gap:4px;z-index:2}
.slot:hover .tools{display:flex}
.tools button{
  width:22px;height:22px;border-radius:6px;border:0;cursor:pointer;font-size:11px;
  background:rgba(0,0,0,.58);color:#fff;display:grid;place-items:center;
}
.tools button:hover{background:rgba(0,0,0,.8)}

/* 인물 사진 — 끌어서 이동, 휠·슬라이더로 확대 */
.facebox{display:flex;flex-direction:column;gap:5px;align-items:center;flex:none}
.slot.face{width:150px;height:150px;padding:0;border-radius:16px;border-style:solid;border-color:var(--rule-soft);touch-action:none}
.slot.face.empty{border-style:dashed;background:var(--surface)}
.slot.face img{
  position:absolute;left:50%;top:50%;width:100%;height:100%;object-fit:cover;
  transform-origin:center;cursor:grab;user-select:none;-webkit-user-drag:none;
}
.slot.face.grabbing img{cursor:grabbing}
.zoom{width:100px}
.slot.cover{width:100%;height:300px}
.slot.cover img{width:100%;height:100%;object-fit:contain;background:#FFFFFF}
.hint{font-size:10.5px;color:var(--ink-3);font-family:"IBM Plex Mono",monospace;text-align:center}

/* ─── 세계관 카드 ─────────────────────────────────────────── */
.uni{
  display:flex;flex-direction:column;gap:12px;
  padding:16px;background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);
}
.uni .f{display:flex;flex-direction:column;gap:4px}
.uni label{
  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);
}
.uni input,.uni textarea{
  background:var(--field);border:1px solid var(--rule-soft);border-radius:8px;padding:8px 10px;width:100%;
}
.uni input.big{font-size:17px;font-weight:600}
.uni textarea{resize:vertical;min-height:74px;line-height:1.6;color:var(--ink-2)}
.uni input:focus,.uni textarea:focus{outline:none;border-color:var(--navy);background:var(--surface)}

/* ─── 본문 레이아웃 ───────────────────────────────────────── */
.cols{display:grid;grid-template-columns:minmax(0,1fr) 268px;gap:20px;align-items:start}
@media (max-width:1000px){ .cols{grid-template-columns:minmax(0,1fr)} }
.flow{display:flex;flex-direction:column;gap:0;min-width:0}

/* ─── 막(幕) ─────────────────────────────────────────────── */
.act{--acc:var(--ink);position:relative}
.acthead{
  position:relative;display:flex;align-items:center;gap:12px;padding:10px 14px;
  background:var(--surface);border:1px solid var(--rule);
  border-left:5px solid var(--acc);border-radius:12px;box-shadow:var(--shadow);
}
.acthead .han{
  font-family:"Bricolage Grotesque","IBM Plex Sans KR",serif;font-size:21px;line-height:1;
  width:42px;height:42px;border-radius:10px;flex:none;
  background:var(--acc);color:#fff;font-weight:700;text-align:center;
  border:0;padding:0;
}
.acthead .han:focus{outline:2px solid var(--ink);outline-offset:2px}
.acthead .t{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1}
.acthead .aname{
  background:transparent;border:0;border-bottom:1px dashed transparent;
  font-size:16px;font-weight:700;letter-spacing:-.01em;padding:1px 0;width:100%;
}
.acthead .adesc{
  background:transparent;border:0;border-bottom:1px dashed transparent;
  font-size:12.5px;color:var(--ink-3);padding:1px 0;width:100%;
}
.acthead .aname:hover,.acthead .adesc:hover{border-bottom-color:var(--rule)}
.acthead .aname:focus,.acthead .adesc:focus{outline:none;border-bottom-color:var(--acc)}
.acthead .cnt{
  font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-2);
  background:var(--field);border:1px solid var(--rule-soft);border-radius:999px;padding:3px 9px;
}
.actcmds{display:flex;align-items:center;gap:2px;flex:none}
/* 막 머리에서 첫 블럭으로 내려가는 돌기 */
.acthead.has::after{
  content:"";position:absolute;left:50%;margin-left:-15px;bottom:-18px;width:30px;height:18px;
  background:var(--acc);border-radius:0 0 9px 9px;opacity:.8;
}

/* 두 사람의 레인과 가운데 등뼈 */
.stack{
  position:relative;display:grid;grid-template-columns:1fr 1fr;
  column-gap:58px;row-gap:16px;padding:18px 0 0;
}
.stack::before{
  content:"";position:absolute;left:50%;margin-left:-3px;top:0;bottom:0;width:6px;
  background:var(--acc);opacity:.26;border-radius:3px;
}
.addrow{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;position:relative}

/* 막과 막 사이 이음선 */
.joint{height:36px;position:relative;margin:2px 0}
.joint::before{
  content:"";position:absolute;left:50%;margin-left:-3px;top:0;bottom:0;width:6px;
  background:linear-gradient(var(--from),var(--to));border-radius:3px;
}
.joint::after{
  content:"";position:absolute;left:50%;margin-left:-8px;bottom:-2px;
  border-left:8px solid transparent;border-right:8px solid transparent;
  border-top:9px solid var(--to);
}
.addact{
  align-self:center;margin-top:14px;
  border:1px dashed var(--rule);background:transparent;color:var(--ink-3);
  padding:9px 18px;border-radius:10px;cursor:pointer;font-size:13px;
}
.addact:hover{border-color:var(--navy);color:var(--ink);background:var(--surface)}

/* ─── 블럭 ───────────────────────────────────────────────── */
.block{
  position:relative;background:var(--surface);
  border:1px solid var(--rule);border-left:5px solid var(--c);
  border-radius:12px;box-shadow:var(--shadow);
  display:grid;grid-template-columns:22px minmax(0,1fr) 30px;gap:10px;
  padding:11px 12px;transition:box-shadow .12s, opacity .12s;min-width:0;
}
.block.a{grid-column:1;--c:var(--ca)}
.block.b{grid-column:2;--c:var(--cb)}
.block.both{
  grid-column:1 / -1;justify-self:center;width:min(100%,600px);z-index:1;
  --c:var(--acc);border-right:5px solid var(--acc);
}
.block:hover{box-shadow:var(--shadow-lift)}
/* 등뼈로 뻗는 이음 막대 */
.block::after{
  content:"";position:absolute;top:50%;margin-top:-3px;height:6px;width:58px;
  background:var(--acc);opacity:.45;
}
.block.a::after{right:-58px}
.block.b::after{left:-58px}
.block.both::after{display:none}
.block.dragging{opacity:.45}
.block.drop-before{box-shadow:0 -3px 0 var(--navy), var(--shadow-lift)}
.block.drop-after{box-shadow:0 3px 0 var(--navy), var(--shadow-lift)}

.grip{
  cursor:grab;color:var(--ink-3);font-size:15px;line-height:1;user-select:none;
  display:flex;align-items:flex-start;justify-content:center;padding-top:6px;
}
.grip:active{cursor:grabbing}
.bmain{display:flex;flex-direction:column;gap:7px;min-width:0}
.btitle{
  background:transparent;border:0;border-bottom:1px dashed transparent;
  font-size:15.5px;font-weight:600;padding:2px 0;width:100%;
}
.btitle::placeholder{color:var(--ink-3);font-weight:400}
.btitle:hover{border-bottom-color:var(--rule)}
.btitle:focus{outline:none;border-bottom-color:var(--c)}
/* 장면 이미지 — 틀 안에서 끌어 옮기고 휠·슬라이더로 확대 */
.shotbox{display:flex;flex-direction:column;gap:4px}
.slot.shot{
  width:100%;height:190px;padding:0;background:var(--field);
  border-style:solid;border-color:var(--rule-soft);cursor:grab;touch-action:none;
}
.slot.shot img{
  position:absolute;left:50%;top:50%;width:100%;height:100%;object-fit:cover;
  transform-origin:center;user-select:none;-webkit-user-drag:none;
}
.slot.shot.grabbing{cursor:grabbing}
.bzoom{width:100%}
.bbody{
  background:var(--field);border:1px solid var(--rule-soft);border-radius:8px;
  padding:8px 10px;resize:none;overflow:hidden;min-height:44px;
  font-size:14px;line-height:1.6;color:var(--ink-2);width:100%;
}
.bbody:focus{outline:none;border-color:var(--c);background:var(--surface)}
.brow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.btag{
  background:var(--field);border:1px solid var(--rule-soft);border-radius:999px;
  padding:4px 10px;font-size:12.5px;width:120px;min-width:0;color:var(--ink-2);
}
.btag:focus{outline:none;border-color:var(--c)}
.whoseg{display:inline-flex;border:1px solid var(--rule);border-radius:999px;overflow:hidden;background:var(--field)}
.whoseg button{
  border:0;background:transparent;cursor:pointer;padding:3px 9px;font-size:11.5px;
  color:var(--ink-3);max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.whoseg button + button{border-left:1px solid var(--rule-soft)}
.whoseg button[aria-pressed="true"]{background:var(--w);color:#fff;font-weight:600}
.tension{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink-3)}
/* 트랙을 직접 그린다 — accent-color만 쓰면 밝은 색일 때 브라우저가 트랙을 어둡게 잡는다 */
input[type=range]{
  -webkit-appearance:none;appearance:none;
  height:14px;margin:0;background:transparent;cursor:pointer;
}
input[type=range]::-webkit-slider-runnable-track{
  height:6px;border-radius:3px;
  background:linear-gradient(90deg,var(--c,var(--navy)) calc(var(--p,50) * 1%),var(--rule-soft) 0);
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;margin-top:-4px;
  width:14px;height:14px;border-radius:50%;
  background:var(--c,var(--navy));border:2px solid var(--surface);box-shadow:0 0 0 1px var(--rule);
}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--rule-soft)}
input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--c,var(--navy))}
input[type=range]::-moz-range-thumb{
  width:12px;height:12px;border:2px solid var(--surface);border-radius:50%;background:var(--c,var(--navy));
}
.tension input[type=range]{width:96px}
.tension b{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-2);width:24px;text-align:right}
.bside{display:flex;flex-direction:column;gap:3px;align-items:center}
.mini{
  width:26px;height:22px;display:grid;place-items:center;cursor:pointer;
  background:transparent;border:1px solid transparent;border-radius:6px;
  color:var(--ink-3);font-size:12px;line-height:1;
}
.mini:hover{background:var(--field);border-color:var(--rule);color:var(--ink)}
.mini:disabled{opacity:.3;cursor:default}
.mini.del:hover{color:var(--danger);border-color:var(--danger)}
.mini.on{color:var(--acc)}

.addhere{
  border:1px dashed var(--rule);background:transparent;color:var(--ink-3);
  padding:7px 13px;border-radius:10px;cursor:pointer;font-size:12.5px;
  max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.addhere:hover{border-color:var(--acc);color:var(--ink);background:var(--surface)}

/* 접기 모드 — 제목만 한 줄로 훑어본다 */
body[data-collapsed="1"] .bbody,
body[data-collapsed="1"] .brow,
body[data-collapsed="1"] .shotbox{display:none}
body[data-collapsed="1"] .block{grid-template-columns:22px minmax(0,1fr) auto;align-items:center;padding:6px 10px}
body[data-collapsed="1"] .grip{padding-top:0;align-items:center}
body[data-collapsed="1"] .bside{flex-direction:row;gap:1px}

/* 좁은 화면 — 한 줄로 세우고 등뼈를 왼쪽으로 */
@media (max-width:820px){
  .stack{grid-template-columns:minmax(0,1fr);margin-left:30px}
  .stack::before{left:-16px;margin-left:0}
  .block.a,.block.b,.block.both{grid-column:1;width:auto;justify-self:stretch}
  .block.both{border-right-width:1px}
  .block::after,.block.a::after,.block.b::after{left:-30px;right:auto;width:30px}
  .acthead.has::after{left:14px;margin-left:0}
  .joint::before{left:14px;margin-left:0}
  .joint::after{left:14px;margin-left:-8px}
  .addrow{justify-content:flex-start}
}

/* ─── 사이드 ─────────────────────────────────────────────── */
.side{display:flex;flex-direction:column;gap:14px;position:sticky;top:20px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}

.legend{display:flex;flex-direction:column;gap:7px}
.legend .row{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2)}

.legend .bar{flex:1;height:6px;background:var(--field);border-radius:3px;overflow:hidden}

@media (max-width:560px){

}

}

/* ─── 단순버전 ───────────────────────────────────────────
   프로필 한 장 + 세로 타임라인. 읽고 보여 주기 위한 화면. */
body[data-mode="simple"] #pairCard,
body[data-mode="simple"] #uniCard,
body[data-mode="simple"] .cols,
body[data-mode="simple"] #addBtn,
body[data-mode="simple"] #addActBtn,

#simple{display:flex;flex-direction:column;gap:20px;max-width:1240px;width:100%;margin:0 auto}
.pline{
  background:transparent;border:0;border-bottom:1px dashed transparent;width:100%;
  font-size:13.5px;color:var(--ink-3);padding:2px 0;
}
.pline:hover{border-bottom-color:var(--rule)}
.pline:focus{outline:none;border-bottom-color:var(--c)}

}

}

}

}

}

}

          <li>막 머리의 글자·이름·설명·색은 눌러서 바로 고칩니다. ＋ 는 그 아래에 새 막.</li>
          <li>블럭의 이름 버튼으로 누구의 장면인지 바꿉니다. 가운데 <b>함께</b>는 둘이 같이 있는 장면.</li>
          <li>블럭의 🖼 로 그 장면의 이미지를 넣습니다.</li>
          <li>인물 사진은 끌어서 옮기고 휠이나 슬라이더로 확대합니다. 두 번 누르면 원위치.</li>

<script>
"use strict";
const $ = s => document.querySelector(s);
const KEY = "pair-arc-v1";
const THEMES = ["baekco","blooming","bluelemon","grad"];
const GRAD_DEFAULT = {c1:"#FFE3F1", c2:"#D8E7FF"};

const uid = p => p + Math.random().toString(36).slice(2,8);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clamp = (v,lo,hi) => Math.max(lo, Math.min(hi, v));
const short = (s, n) => { s = (s || "").trim(); return s ? (s.length > n ? s.slice(0,n) + "…" : s) : "이름"; };
const hex = (c, fb) => /^#[0-9a-f]{6}$/i.test(c || "") ? c : fb;

/* 색 계산 — 그라데이션 테마가 두 색에서 나머지 색을 뽑아낸다 */
const toRGB = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
const toHex = a => "#" + a.map(v => {
  const s = clamp(Math.round(v),0,255).toString(16);
  return s.length < 2 ? "0" + s : s;
}).join("");
const mixc = (a, b, t) => { const x = toRGB(a), y = toRGB(b); return toHex(x.map((v,i) => v + (y[i]-v)*t)); };
const lum = c => {
  const v = toRGB(c).map(n => { n /= 255; return n <= .03928 ? n/12.92 : Math.pow((n+.055)/1.055, 2.4); });
  return .2126*v[0] + .7152*v[1] + .0722*v[2];
};
function rgb2hsl(c){
  const v = toRGB(c).map(n => n/255);
  const mx = Math.max.apply(null,v), mn = Math.min.apply(null,v), l = (mx+mn)/2;
  let h = 0, s = 0;
  if(mx !== mn){
    const d = mx - mn;
    s = l > .5 ? d/(2-mx-mn) : d/(mx+mn);
    h = mx === v[0] ? (v[1]-v[2])/d + (v[1] < v[2] ? 6 : 0)
      : mx === v[1] ? (v[2]-v[0])/d + 2
      : (v[0]-v[1])/d + 4;
    h *= 60;
  }
  return [h, s, l];
}
function hsl2hex(h, s, l){
  h = ((h % 360) + 360) % 360; s = clamp(s,0,1); l = clamp(l,0,1);
  const c = (1 - Math.abs(2*l - 1)) * s, x = c * (1 - Math.abs((h/60) % 2 - 1)), m = l - c/2;
  const t = h < 60 ? [c,x,0] : h < 120 ? [x,c,0] : h < 180 ? [0,c,x]
          : h < 240 ? [0,x,c] : h < 300 ? [x,0,c] : [c,0,x];
  return toHex(t.map(n => (n + m) * 255));
}

/* 기본 막 — 기승전결. 이름도 색도 개수도 바꿀 수 있다. */
const ACT_PALETTE = ["#3E8BD6","#22A179","#E0673C","#9B62D6","#D64F8B","#C99A2E","#3FA3A8","#7A7FD6"];
const DEFAULT_ACTS = () => [
  {id:uid("t"), label:"起", name:"기 · 발단",      desc:"두 사람의 자리와 첫 접점", color:ACT_PALETTE[0]},
  {id:uid("t"), label:"承", name:"승 · 전개",      desc:"관계가 쌓이고 어긋난다",   color:ACT_PALETTE[1]},
  {id:uid("t"), label:"轉", name:"전 · 위기·절정", desc:"판이 뒤집히는 순간",       color:ACT_PALETTE[2]},
  {id:uid("t"), label:"結", name:"결 · 결말",      desc:"남은 것과 달라진 자리",    color:ACT_PALETTE[3]}
];
const OLD_KEYS = ["기","승","전","결"];   // 예전 데이터의 막 이름

/* ─── 기본 데이터 ────────────────────────────────────────── */
function seed(){
  const o = DEFAULT_ACTS(), au = DEFAULT_ACTS();
  return {
    theme:"baekco", collapsed:false, cur:"p1",
    pairs:[{
      id:"p1",
      a:{name:"인물 A", line:"먼저 다가가는 쪽",   color:"#3E8BD6", img:null, iz:1, ix:0, iy:0},
      b:{name:"인물 B", line:"물러서다 붙잡는 쪽", color:"#D64F8B", img:null, iz:1, ix:0, iy:0},
      curU:"u1",
      universes:[
        {id:"u1", kind:"origin", name:"오리지널", note:"본편에서 실제로 일어나는 이야기.", cover:null, acts:o, blocks:[
          {id:uid("k"), actId:o[0].id, who:"a",    title:"먼저 눈에 띈 쪽",   body:"A가 B를 알아보는 장면. 무엇이 걸렸는지 한 줄로.", tension:22, tag:"#첫만남", img:null},
          {id:uid("k"), actId:o[0].id, who:"b",    title:"모른 척한 이유",    body:"B에게는 다가가지 못할 사정이 있다.",             tension:30, tag:"",        img:null},
          {id:uid("k"), actId:o[0].id, who:"both", title:"처음 나란히 선 날", body:"두 사람이 같은 자리에 놓인다.",                  tension:38, tag:"#접점",   img:null},
          {id:uid("k"), actId:o[1].id, who:"both", title:"가까워지는 사이",   body:"함께 보내는 시간이 늘어난다.",                   tension:55, tag:"#전개",   img:null},
          {id:uid("k"), actId:o[1].id, who:"b",    title:"숨긴 것이 커진다",  body:"B가 말하지 못한 것이 무게를 갖는다.",            tension:66, tag:"",        img:null},
          {id:uid("k"), actId:o[2].id, who:"a",    title:"알아버린 순간",     body:"A가 전부를 알게 된다. 가장 높은 지점.",          tension:95, tag:"#절정",   img:null},
          {id:uid("k"), actId:o[2].id, who:"b",    title:"밀어내는 선택",     body:"B는 지키려고 등을 돌린다.",                      tension:88, tag:"",        img:null},
          {id:uid("k"), actId:o[3].id, who:"both", title:"다시 마주 보기",    body:"무엇을 잃고 무엇이 남았는지로 닫는다.",          tension:42, tag:"#결말",   img:null}
        ]},
        {id:"u2", kind:"au", name:"AU · 만약에", note:"만약 그때 다른 선택을 했다면.", cover:null, acts:au, blocks:[
          {id:uid("k"), actId:au[0].id, who:"both", title:"다른 세계의 첫 장면", body:"이 AU의 전제를 보여 주는 장면.",   tension:25, tag:"#AU", img:null},
          {id:uid("k"), actId:au[2].id, who:"a",    title:"여기서 갈린다",       body:"오리지널과 달라지는 결정적 순간.", tension:80, tag:"",    img:null}
        ]}
      ]
    }]
  };
}

function normPerson(p, name, color){
  p = p || {};
  p.name = p.name || name;
  p.line = p.line || "";
  p.age = p.age || "";          // 단순버전 프로필용
  p.tags = p.tags || "";
  // 항목표 — 이름도 개수도 자유롭게. 예전 like/hate/trait 데이터는 여기로 옮긴다.
  if(!Array.isArray(p.info) || !p.info.length){
    p.info = [
      {id:uid("i"), k:"좋아하는 것", v:p.like  || ""},
      {id:uid("i"), k:"싫어하는 것", v:p.hate  || ""},
      {id:uid("i"), k:"특징",       v:p.trait || ""}
    ];
  }
  p.info.forEach(r => { r.id = r.id || uid("i"); r.k = r.k || ""; r.v = r.v || ""; });
  delete p.like; delete p.hate; delete p.trait;
  p.color = hex(p.color, color);
  p.img = typeof p.img === "string" ? p.img : null;
  p.iz = clamp(+p.iz || 1, .4, 4);
  p.ix = +p.ix || 0; p.iy = +p.iy || 0;
  return p;
}

function normalize(d){
  if(!d || !Array.isArray(d.pairs) || !d.pairs.length) return null;
  if(THEMES.indexOf(d.theme) < 0) d.theme = "baekco";   // 예전 라이트·다크는 백코로
  d.mode = d.mode === "simple" ? "simple" : "detail";
  d.grad = {c1:hex(d.grad && d.grad.c1, GRAD_DEFAULT.c1), c2:hex(d.grad && d.grad.c2, GRAD_DEFAULT.c2)};
  d.collapsed = !!d.collapsed;
  d.pairs.forEach(p => {
    p.id = p.id || uid("p");
    p.a = normPerson(p.a, "인물 A", "#3E8BD6");
    p.b = normPerson(p.b, "인물 B", "#D64F8B");
    if(!Array.isArray(p.universes) || !p.universes.length){
      p.universes = [{id:uid("u"), kind:"origin", name:"오리지널", note:"", cover:null, acts:DEFAULT_ACTS(), blocks:[]}];
    }
    p.universes.forEach(u => {
      u.id = u.id || uid("u");
      u.kind = u.kind === "au" ? "au" : "origin";
      u.name = u.name || (u.kind === "au" ? "AU" : "오리지널");
      u.note = u.note || "";
      u.cover = typeof u.cover === "string" ? u.cover : null;
      if(!Array.isArray(u.acts) || !u.acts.length) u.acts = DEFAULT_ACTS();
      u.acts.forEach((t, i) => {
        t.id = t.id || uid("t");
        t.label = String(t.label || (i+1)).slice(0,2);
        t.name = t.name || ("막 " + (i+1));
        t.desc = t.desc || "";
        t.color = hex(t.color, ACT_PALETTE[i % ACT_PALETTE.length]);
      });
      u.blocks = Array.isArray(u.blocks) ? u.blocks : [];
      u.blocks.forEach(b => {
        b.id = b.id || uid("k");
        // 예전 데이터: b.act 가 "기"·"승"… 이던 시절을 지금의 막 id로 옮긴다
        if(!b.actId && b.act){
          const i = OLD_KEYS.indexOf(b.act);
          b.actId = (u.acts[i] || u.acts[0]).id;
        }
        delete b.act;
        if(!u.acts.some(t => t.id === b.actId)) b.actId = u.acts[0].id;
        if(["a","b","both"].indexOf(b.who) < 0) b.who = "both";
        b.title = b.title || ""; b.body = b.body || ""; b.tag = b.tag || "";
        b.img = typeof b.img === "string" ? b.img : null;
        b.iz = clamp(+b.iz || 1, .4, 4);
        b.ix = +b.ix || 0; b.iy = +b.iy || 0;
        b.tension = clamp(+b.tension || 0, 0, 100);
      });
      sortBlocks(u);
    });
    if(!p.universes.some(u => u.id === p.curU)) p.curU = p.universes[0].id;
  });
  if(!d.pairs.some(p => p.id === d.cur)) d.cur = d.pairs[0].id;
  return d;
}

// 배열 순서와 화면 순서를 맞춘다 — 이후 조작은 전부 배열 순서 기준
function sortBlocks(u){
  const order = {};
  u.acts.forEach((t,i) => order[t.id] = i);
  u.blocks.sort((x,y) => order[x.actId] - order[y.actId]);
}

function load(){
  try{ return normalize(JSON.parse(localStorage.getItem(KEY))); }
  catch(e){ return null; }
}
let saveTimer = null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try{
      localStorage.setItem(KEY, JSON.stringify(state));
      $("#savedAt").textContent = "저장됨 " + new Date().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"});
    }catch(e){
      $("#savedAt").textContent = e && e.name === "QuotaExceededError"
        ? "저장 공간이 가득 찼습니다 — 사진을 줄여 주세요"
        : "이 환경에서는 자동 저장이 안 됩니다";
    }
  }, 250);
}

let state = load() || normalize(seed());
const pair = () => state.pairs.find(p => p.id === state.cur) || state.pairs[0];
const uni  = () => { const p = pair(); return p.universes.find(u => u.id === p.curU) || p.universes[0]; };
const acts = () => uni().acts;
const blocks = () => uni().blocks;
const actById = id => acts().find(t => t.id === id) || acts()[0];
const actIdx = id => acts().findIndex(t => t.id === id);
const blocksOf = id => blocks().filter(b => b.actId === id);
const blockById = id => blocks().find(b => b.id === id);
const whoColor = w => w === "a" ? pair().a.color : w === "b" ? pair().b.color : "var(--ink-3)";
const pairTitle = p => short(p.a.name, 8) + " × " + short(p.b.name, 8);

/* ─── 테마 ───────────────────────────────────────────────
   그라데이션은 고른 두 색에서 종이·글자·선·강조색을 계산해 :root에 얹는다.
   카드는 흰 바탕을 유지하므로 어떤 색을 골라도 글자가 읽힌다. */
const GRAD_VARS = ["--paper","--field","--surface","--ink","--ink-2","--ink-3",
  "--rule","--rule-soft","--navy","--navy-ink","--danger","--body-bg","--shadow","--shadow-lift"];

function applyTheme(){
  const root = document.documentElement;
  root.dataset.theme = state.theme;
  GRAD_VARS.forEach(v => root.style.removeProperty(v));
  $("#gradPick").hidden = state.theme !== "grad";
  if(state.theme !== "grad") return;

  const c1 = state.grad.c1, c2 = state.grad.c2;
  $("#gradC1").value = c1;
  $("#gradC2").value = c2;

  // 어두운 쪽 색의 색상(hue)을 살려 진한 강조색을 만든다 — 파스텔을 골라도 흐려지지 않게
  const base = lum(c1) < lum(c2) ? c1 : c2;
  const hs = rgb2hsl(base);
  const warmMid = hs[0] > 38 && hs[0] < 200;        // 노랑·초록은 더 어두워야 흰 글씨가 읽힌다
  const acc = hs[1] < .08 ? "#39404E" : hsl2hex(hs[0], clamp(Math.max(hs[1], .5), 0, .88), warmMid ? .29 : .40);
  const ink = mixc("#161A21", acc, .16);
  const set = (k, v) => root.style.setProperty(k, v);
  set("--surface", "#FFFFFF");
  set("--paper",   mixc(c1, "#FFFFFF", .70));
  set("--field",   mixc(c1, "#FFFFFF", .90));
  set("--ink",     ink);
  set("--ink-2",   mixc(ink, "#FFFFFF", .34));
  set("--ink-3",   mixc(ink, "#FFFFFF", .56));
  set("--rule",      mixc(acc, "#FFFFFF", .74));
  set("--rule-soft", mixc(acc, "#FFFFFF", .88));
  set("--navy", acc);
  set("--navy-ink", "#FFFFFF");
  set("--danger", "#C2374B");
  set("--body-bg", "linear-gradient(168deg," + c1 + " 0%," + mixc(c1, c2, .5) + " 50%," + c2 + " 100%)");
  set("--shadow",      "0 1px 2px rgba(22,26,33,.07), 0 10px 26px -12px rgba(22,26,33,.30)");
  set("--shadow-lift", "0 2px 8px rgba(22,26,33,.12), 0 20px 44px -16px rgba(22,26,33,.40)");
}

/* ─── 그리기 ─────────────────────────────────────────────── */
function render(){
  applyTheme();
  document.body.dataset.collapsed = state.collapsed ? "1" : "0";
  $("#themeSeg").querySelectorAll("button").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.set === state.theme)));
  $("#collapseBtn").setAttribute("aria-pressed", String(state.collapsed));

  const p = pair();
  document.body.style.setProperty("--ca", p.a.color);
  document.body.style.setProperty("--cb", p.b.color);

  document.body.dataset.mode = state.mode;
  $("#modeSeg").querySelectorAll("button").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.mode === state.mode)));

  renderPairTabs();
  renderUniTabs();
  if(state.mode === "simple"){
    renderSimple();
  }else{
    renderPairCard();
    renderUniCard();
    renderFlow();
    renderAux();
  }
  requestAnimationFrame(growAll);   // 자리를 잡은 뒤 한 번 더 높이를 맞춘다
}

/* ─── 단순버전 ───────────────────────────────────────────
   프로필 카드 두 장과, 막을 표시로만 남긴 세로 타임라인. */
// 태그는 평소엔 칩으로만 보이고 ✎ 를 누르면 한 줄로 고친다
function chipsHTML(side, editing){
  const c = pair()[side];
  const tags = (c.tags || "").split(/[,\s]+/).filter(Boolean);
  if(editing || !tags.length){
    return '<input class="chipedit" type="text" data-p="' + side + '.tags" value="' + esc(c.tags) +
           '" placeholder="#태그 #태그 (띄어쓰기로 구분)">';
  }
  return tags.map(t => '<span class="chip">' + esc(t[0] === "#" ? t : "#" + t) + '</span>').join("") +
         '<button class="chip edit" data-edittags="' + side + '" title="태그 수정">✎</button>';
}

function profileHTML(side){
  const p = pair(), c = p[side];
  const rows = c.info.map(r =>
    '<div class="kvrow" data-row="' + r.id + '">' +
      '<input class="kvk" type="text" data-i="' + side + '.' + r.id + '.k" value="' + esc(r.k) + '" placeholder="항목">' +
      '<textarea class="kvv" rows="1" data-i="' + side + '.' + r.id + '.v" placeholder="내용">' + esc(r.v) + '</textarea>' +
      '<button class="kvdel" data-delrow="' + side + '.' + r.id + '" title="이 항목 지우기" aria-label="이 항목 지우기">✕</button>' +
    '</div>').join("");
  return '<section class="profile" data-side="' + side + '" style="--c:' + c.color + '">' +
    '<div class="facebox">' +
      '<div class="slot face' + (c.img ? "" : " empty") + '" data-slot="' + side + '" style="--c:' + c.color + '"' +
        (c.img ? ' title="끌어서 이동 · 휠로 확대 · 두 번 눌러 원위치"' : ' title="사진 넣기"') + '>' +
        (c.img
          ? '<img src="' + c.img + '" alt="" draggable="false" style="' + panStyle(c) + '">' +
            '<span class="tools"><button data-repick="' + side + '" title="사진 바꾸기">⟳</button>' +
            '<button data-clear="' + side + '" title="사진 지우기">✕</button></span>'
          : "＋<br>사진") +
      '</div>' +
      (c.img ? '<input type="range" class="zoom" min="0.4" max="4" step="0.01" value="' + c.iz + '"' +

const stat = (k,v) => '<div class="stat"><span class="k">' + k + '</span><span class="v">' + v + '</span></div>';
function legendRow(name, color, n, total){
  const pct = total ? Math.round(n / total * 100) : 0;
  return '<div class="row"><span class="dot" style="background:' + color + '"></span>' +
    '<span class="nm">' + esc(name) + '</span>' +
    '<span class="bar"><i style="width:' + pct + '%;background:' + color + '"></i></span>' +
    '<span class="num">' + n + '</span></div>';
}

function renderCurve(bs){
  const wrap = $("#curveWrap"), p = pair();
  if(bs.length < 2){
    wrap.innerHTML = '<p class="empty-note">블럭이 두 개 이상이면 두 사람의 감정 곡선이 그려집니다.</p>';
    return;
  }
  const W = 240, H = 132, PT = 12, PB = 22, PL = 8, PR = 8;
  const x = i => PL + i * (W - PL - PR) / (bs.length - 1);
  const y = v => PT + (100 - v) / 100 * (H - PT - PB);

  // 두 사람의 선을 따로 그린다 — 함께 장면은 둘 다에 찍힌다
  const series = side => {
    const pts = [];
    bs.forEach((b,i) => { if(b.who === side || b.who === "both") pts.push([x(i), y(b.tension)]); });
    return pts;
  };
  const path = pts => {
    if(pts.length < 2) return "";
    let d = "M" + pts[0][0].toFixed(1) + "," + pts[0][1].toFixed(1);
    for(let i=1;i<pts.length;i++){
      const q0 = pts[i-1], q1 = pts[i], mx = ((q0[0]+q1[0])/2).toFixed(1);
      d += " C" + mx + "," + q0[1].toFixed(1) + " " + mx + "," + q1[1].toFixed(1) +
           " " + q1[0].toFixed(1) + "," + q1[1].toFixed(1);
    }
    return d;
  };
  const pa = series("a"), pb = series("b");
  const line = (pts, col) => path(pts)
    ? '<path d="' + path(pts) + '" fill="none" stroke="' + col + '" stroke-width="1.8" stroke-linecap="round"/>' : "";
  const dots = (pts, col) => pts.map(q =>
    '<circle cx="' + q[0].toFixed(1) + '" cy="' + q[1].toFixed(1) + '" r="2.6" fill="' + col + '"/>').join("");

  let ticks = "", labels = "";
  bs.forEach((b,i) => {
    if(i && b.actId !== bs[i-1].actId){
      const tx = ((x(i-1) + x(i)) / 2).toFixed(1);
      ticks += '<line x1="' + tx + '" y1="' + PT + '" x2="' + tx + '" y2="' + (H-PB) +
               '" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" opacity=".3"/>';
    }
  });
  acts().forEach(t => {
    const idx = bs.map((b,i) => b.actId === t.id ? i : -1).filter(i => i >= 0);
    if(!idx.length) return;
    const mid = (x(idx[0]) + x(idx[idx.length-1])) / 2;
    labels += '<text x="' + mid.toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle" font-size="10" fill="' + t.color + '">' +
      esc(t.label) + '</text>';
  });

  wrap.innerHTML =
    '<svg class="curve" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="두 사람의 감정 곡선" style="color:var(--ink-3)">' +
      '<line x1="' + PL + '" y1="' + (H-PB) + '" x2="' + (W-PR) + '" y2="' + (H-PB) + '" stroke="currentColor" opacity=".3"/>' +
      ticks + line(pa, p.a.color) + line(pb, p.b.color) + dots(pa, p.a.color) + dots(pb, p.b.color) + labels +
    '</svg>';
}

/* ─── 막 조작 ────────────────────────────────────────────── */
function addAct(afterIdx){
  const u = uni(), ts = u.acts;
  const t = {
    id:uid("t"), label:String(ts.length + 1), name:"새 막", desc:"",
    color:ACT_PALETTE[ts.length % ACT_PALETTE.length]
  };
  ts.splice(afterIdx == null ? ts.length : afterIdx + 1, 0, t);
  sortBlocks(u);
  save(); render();
  const el = document.querySelector('.act[data-act="' + t.id + '"] .aname');
  if(el){ el.focus(); el.select(); el.scrollIntoView({block:"center", behavior:"smooth"}); }
}
function moveAct(id, dir){
  const u = uni(), i = actIdx(id), j = i + dir;
  if(j < 0 || j >= u.acts.length) return;
  const t = u.acts.splice(i,1)[0];
  u.acts.splice(j,0,t);
  sortBlocks(u);
  save(); render();
  const el = document.querySelector('.act[data-act="' + id + '"]');
  if(el) el.scrollIntoView({block:"nearest", behavior:"smooth"});
}
function delAct(id){
  const u = uni();
  if(u.acts.length < 2){ notify("막은 하나 이상 있어야 합니다"); return; }
  const t = actById(id), n = blocksOf(id).length;
  const go = () => {
    u.acts = u.acts.filter(x => x.id !== id);
    u.blocks = u.blocks.filter(b => b.actId !== id);
    save(); render();
    notify("‘" + t.name + "’ 막을 지웠습니다");
  };
  if(!n) return go();                              // 빈 막은 바로 지운다
  ask("‘" + t.name + "’ 막을 지울까요?\n안에 있는 블럭 " + n + "개도 함께 지워집니다.", go);
}

/* ─── 블럭 조작 ──────────────────────────────────────────── */
function defaultTension(actId){
  const i = actIdx(actId), n = acts().length;
  return n < 2 ? 50 : Math.round(25 + 60 * (i / (n - 1)));
}

// 블럭을 지정한 막의 idx 자리에 꽂는다 (b는 배열에서 빠져 있어야 한다)
function placeInAct(b, actId, idx){
  const arr = blocks(), order = actIdx(actId);
  b.actId = actId;
  const list = arr.filter(x => x.actId === actId);
  if(idx < list.length){
    arr.splice(arr.indexOf(list[idx]), 0, b);
  }else if(list.length){
    arr.splice(arr.indexOf(list[list.length-1]) + 1, 0, b);
  }else{
    const later = arr.find(x => actIdx(x.actId) > order);
    arr.splice(later ? arr.indexOf(later) : arr.length, 0, b);
  }
}

function addBlock(actId, who, afterId){
  const b = {id:uid("k"), actId:actId, who:who || "both", title:"", body:"",
             tension:defaultTension(actId), tag:"", img:null, iz:1, ix:0, iy:0};
  const list = blocksOf(actId);
  const at = afterId ? list.indexOf(blockById(afterId)) + 1 : list.length;
  placeInAct(b, actId, at);
  save(); render();
  const el = $('.block[data-id="' + b.id + '"] .btitle');
  if(el){ el.focus(); el.scrollIntoView({block:"center", behavior:"smooth"}); }
}

function moveBlock(id, dir){
  const arr = blocks(), b = blockById(id);
  const list = blocksOf(b.actId);
  const i = list.indexOf(b), j = i + dir;
  if(j >= 0 && j < list.length){                 // 같은 막 안에서 자리 바꾸기
    const other = list[j];
    const bi = arr.indexOf(b), oi = arr.indexOf(other);
    arr[bi] = other; arr[oi] = b;
  }else{                                          // 막 경계를 넘어간다
    const ni = actIdx(b.actId) + dir;
    if(ni < 0 || ni >= acts().length) return;
    const target = acts()[ni].id;
    arr.splice(arr.indexOf(b), 1);
    placeInAct(b, target, dir > 0 ? 0 : arr.filter(x => x.actId === target).length);
  }
  save(); render();
  const el = $('.block[data-id="' + id + '"]');
  if(el) el.scrollIntoView({block:"nearest", behavior:"smooth"});
}

/* ─── 이벤트: 흐름(막 + 블럭) ────────────────────────────── */
const flow = $("#flow");

flow.addEventListener("input", e => {
  const el = e.target;

  const af = el.dataset.af;                       // 막 고치기 — 다시 그리지 않는다
  if(af){
    const sec = el.closest(".act"), t = actById(sec.dataset.act);
    t[af] = af === "color" ? hex(el.value, t.color) : el.value;
    if(af === "color"){
      sec.style.setProperty("--acc", t.color);
      const next = sec.nextElementSibling, prev = sec.previousElementSibling;
      if(next && next.classList.contains("joint")) next.style.setProperty("--from", t.color);
      if(prev && prev.classList.contains("joint")) prev.style.setProperty("--to", t.color);
    }
    save(); renderAux();
    return;
  }

  const bz = el.dataset.bzoom;                    // 장면 이미지 확대 슬라이더
  if(bz){
    const b = blockById(bz);
    b.iz = clamp(+el.value, .4, 4);
    el.style.setProperty("--p", zoomPct(b.iz));
    applyShot(bz);
    save();
    return;
  }

  const f = el.dataset.f;
  if(!f) return;
  const host = el.closest(".block"), b = blockById(host.dataset.id);
  if(!b) return;
  if(f === "tension"){
    b.tension = clamp(+el.value, 0, 100);
    el.style.setProperty("--p", b.tension);
    host.querySelector(".tension b").textContent = b.tension;
  }else{
    b[f] = el.value;
    if(f === "body") grow(el);
  }
  save(); renderAux();
});

flow.addEventListener("click", e => {
  if(e.target.closest("#addActEnd")){ addAct(); return; }

  const acmd = e.target.closest("[data-actcmd]");
  if(acmd){
    const id = acmd.closest(".act").dataset.act, k = acmd.dataset.actcmd;
    if(k === "add") addAct(actIdx(id));
    else if(k === "del") delAct(id);
    else moveAct(id, k === "up" ? -1 : 1);
    return;
  }

  const add = e.target.closest("[data-add]");
  if(add){ addBlock(add.dataset.add, add.dataset.who); return; }

  const rep = e.target.closest("[data-repick]");
  if(rep){ pickImage(rep.dataset.repick); return; }
  const clr = e.target.closest("[data-clear]");
  if(clr){
    const b = blockById(clr.dataset.clear.slice(4));
    if(b){ b.img = null; b.iz = 1; b.ix = 0; b.iy = 0; save(); render(); }
    return;
  }

  const whoBtn = e.target.closest(".whoseg [data-who]");
  if(whoBtn){
    const b = blockById(whoBtn.closest(".block").dataset.id);
    if(b.who !== whoBtn.dataset.who){ b.who = whoBtn.dataset.who; save(); render(); }
    return;
  }

  const cmd = e.target.closest("[data-cmd]");
  if(!cmd) return;
  const id = cmd.closest(".block").dataset.id;
  const arr = blocks(), b = blockById(id), k = cmd.dataset.cmd;
  if(k === "img"){
    pickImage("blk:" + id);
  }else if(k === "del"){
    const preview = b.title || b.body.slice(0,30);
    const go = () => { arr.splice(arr.indexOf(b), 1); save(); render(); };
    if(!preview && !b.img) return go();             // 빈 블럭은 바로 지운다
    ask("이 블럭을 지울까요?\n\n" + (preview || "(제목 없는 이미지 블럭)"), go);
  }else if(k === "dup"){
    arr.splice(arr.indexOf(b) + 1, 0, Object.assign({}, b, {id:uid("k")}));
    save(); render();
  }else{
    moveBlock(id, k === "up" ? -1 : 1);
  }
});

// 제목에서 Enter → 본문으로, 어디서든 Ctrl+Enter → 바로 아래에 같은 사람의 새 블럭

/* 장면 이미지: 끌어서 이동 · 휠로 확대 — 인물 사진과 같은 방식 */
function applyShot(id){
  const b = blockById(id);
  const img = document.querySelector('.slot.shot[data-shot="' + id + '"] img');
  if(b && img) img.style.cssText = panStyle(b);
}
let shotPan = null;
document.addEventListener("wheel", e => {
  const slot = e.target.closest(".slot.shot");
  if(!slot) return;
  e.preventDefault();
  const id = slot.dataset.shot, b = blockById(id);
  b.iz = clamp(b.iz * (1 - e.deltaY * 0.0015), .4, 4);
  applyShot(id);
  const z = document.querySelector('[data-bzoom="' + id + '"]');
  if(z){ z.value = b.iz; z.style.setProperty("--p", zoomPct(b.iz)); }
  save();
}, {passive:false});
document.addEventListener("dblclick", e => {                    // 두 번 누르면 원위치
  const slot = e.target.closest(".slot.shot");
  if(!slot) return;
  const b = blockById(slot.dataset.shot);
  b.iz = 1; b.ix = 0; b.iy = 0;
  applyShot(slot.dataset.shot);
  const z = document.querySelector('[data-bzoom="' + slot.dataset.shot + '"]');
  if(z){ z.value = 1; z.style.setProperty("--p", zoomPct(1)); }
  save();
});

/* 드래그 — 손잡이를 누르는 동안에만 블럭이 끌린다 */
let dragId = null;
flow.addEventListener("pointerdown", e => {
  const g = e.target.closest("[data-grip]");
  if(g) g.closest(".block").draggable = true;
});
document.addEventListener("pointerdown", e => {
  const slot = e.target.closest(".slot.shot");
  if(slot && !e.target.closest(".tools")){
    const b = blockById(slot.dataset.shot);
    shotPan = {id:slot.dataset.shot, x:e.clientX, y:e.clientY, ix:b.ix, iy:b.iy};
    slot.classList.add("grabbing");
    try{ slot.setPointerCapture(e.pointerId); }catch(err){}
  }
});
document.addEventListener("pointermove", e => {
  if(!shotPan) return;
  const b = blockById(shotPan.id);
  b.ix = shotPan.ix + (e.clientX - shotPan.x);
  b.iy = shotPan.iy + (e.clientY - shotPan.y);
  applyShot(shotPan.id);
});
document.addEventListener("pointerup", () => {
  if(!shotPan) return;
  const slot = document.querySelector('.slot.shot[data-shot="' + shotPan.id + '"]');
  if(slot) slot.classList.remove("grabbing");
  shotPan = null;
  save();
});
flow.addEventListener("dragstart", e => {
  const host = e.target.closest(".block");
  if(!host || !host.draggable){ e.preventDefault(); return; }
  dragId = host.dataset.id;
  host.classList.add("dragging");
  e.dataTransfer.effectAllowed = "move";
  try{ e.dataTransfer.setData("text/plain", dragId); }catch(err){}
});
flow.addEventListener("dragend", () => {
  flow.querySelectorAll(".block").forEach(el => {
    el.draggable = false;
    el.classList.remove("dragging","drop-before","drop-after");
  });
  dragId = null;
});
flow.addEventListener("dragover", e => {
  if(!dragId || !e.target.closest(".stack")) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = "move";
  flow.querySelectorAll(".drop-before,.drop-after").forEach(el => el.classList.remove("drop-before","drop-after"));
  const over = e.target.closest(".block");
  if(over && over.dataset.id !== dragId){
    const r = over.getBoundingClientRect();
    over.classList.add(e.clientY < r.top + r.height/2 ? "drop-before" : "drop-after");
  }
});
flow.addEventListener("drop", e => {
  const stack = e.target.closest(".stack");
  if(!dragId || !stack) return;
  e.preventDefault();
  const actId = stack.dataset.stack;
  const arr = blocks(), b = blockById(dragId);
  const over = e.target.closest(".block");
  const rest = arr.filter(x => x.actId === actId && x.id !== dragId);
  let idx = rest.length;
  if(over && over.dataset.id !== dragId){
    const r = over.getBoundingClientRect();
    const oi = rest.indexOf(blockById(over.dataset.id));
    if(oi >= 0) idx = e.clientY < r.top + r.height/2 ? oi : oi + 1;
  }
  // 함께 장면은 그대로 두고, 한 사람의 장면은 떨어뜨린 레인으로 옮긴다
  if(b.who !== "both" && window.innerWidth > 820){
    const sr = stack.getBoundingClientRect();
    b.who = e.clientX < sr.left + sr.width/2 ? "a" : "b";
  }
  arr.splice(arr.indexOf(b), 1);
  placeInAct(b, actId, idx);
  save(); render();
});

/* ─── 이벤트: 인물 프로필 카드 (상세·단순 공용) ─────────── */
function cardInput(e){
  const el = e.target;

  const key = el.dataset.p;                       // 이름 · 나이 · 한 줄 소개 · 태그
  if(key){
    const parts = key.split(".");
    pair()[parts[0]][parts[1]] = el.value;
    if(parts[1] === "name"){
      el.size = Math.max(3, el.value.length);
      renderPairTabs();
      const nm = short(el.value, 5);              // 레인 버튼의 이름도 따라간다
      document.querySelectorAll('.whoseg [data-who="' + parts[0] + '"]').forEach(b => b.textContent = nm);
      document.querySelectorAll('.addhere[data-who="' + parts[0] + '"]').forEach(b => b.textContent = "＋ " + short(el.value, 6));
    }
    renderAux();
    save();
    return true;
  }

  const inf = el.dataset.i;                       // 항목표 — 이름과 내용 모두 고칠 수 있다
  if(inf){
    const parts = inf.split(".");
    const r = pair()[parts[0]].info.find(x => x.id === parts[1]);
    if(r){
      r[parts[2]] = el.value;
      if(el.tagName === "TEXTAREA") grow(el);
      save();
    }
    return true;
  }

  const side = el.dataset.color;                  // 인물 색 — 고르는 즉시 반영
  if(side){
    const c = pair()[side];
    c.color = hex(el.value, c.color);
    document.body.style.setProperty(side === "a" ? "--ca" : "--cb", c.color);
    const card = el.closest(".profile");
    if(card){
      card.style.setProperty("--c", c.color);
      card.querySelectorAll(".slot,.zoom").forEach(n => n.style.setProperty("--c", c.color));
    }
    document.querySelectorAll('.whoseg [data-who="' + side + '"]').forEach(b => b.style.setProperty("--w", c.color));
    document.querySelectorAll('.entry.' + side).forEach(n => n.style.setProperty("--c", c.color));
    save(); renderAux();
    return true;
  }

  const zside = el.dataset.zoom;                  // 사진 확대 슬라이더
  if(zside){
    const c = pair()[zside];
    c.iz = clamp(+el.value, .4, 4);
    el.style.setProperty("--p", zoomPct(c.iz));
    applyFace(zside);
    save();
    return true;
  }
  return false;
}

function cardClick(e){
  const ed = e.target.closest("[data-edittags]");          // 태그 한 줄 편집
  if(ed){
    const wrap = ed.closest(".chips");
    wrap.innerHTML = chipsHTML(ed.dataset.edittags, true);
    const inp = wrap.querySelector(".chipedit");
    inp.focus();
    inp.setSelectionRange(inp.value.length, inp.value.length);
    return true;
  }

  const add = e.target.closest("[data-addrow]");            // 항목 추가
  if(add){
    const side = add.dataset.addrow;
    const r = {id:uid("i"), k:"", v:""};
    pair()[side].info.push(r);
    save();
    if(state.mode === "simple") renderSimple(); else renderPairCard();
    const el = document.querySelector('[data-i="' + side + "." + r.id + '.k"]');
    if(el){ el.focus(); el.scrollIntoView({block:"nearest"}); }
    return true;
  }
  const del = e.target.closest("[data-delrow]");            // 항목 삭제
  if(del){
    const parts = del.dataset.delrow.split(".");
    const c = pair()[parts[0]];
    const r = c.info.find(x => x.id === parts[1]);
    const go = () => {
      c.info = c.info.filter(x => x.id !== parts[1]);
      save();
      if(state.mode === "simple") renderSimple(); else renderPairCard();
    };
    if(r && (r.k || r.v)) ask("‘" + (r.k || r.v.slice(0,20)) + "’ 항목을 지울까요?", go);
    else go();
    return true;
  }

  const rep = e.target.closest("[data-repick]");            // 인물 사진 바꾸기
  if(rep && (rep.dataset.repick === "a" || rep.dataset.repick === "b")){
    e.stopPropagation(); pickImage(rep.dataset.repick);
    return true;
  }
  const clr = e.target.closest("[data-clear]");             // 인물 사진 지우기
  if(clr && (clr.dataset.clear === "a" || clr.dataset.clear === "b")){
    e.stopPropagation();
    const c = pair()[clr.dataset.clear];
    c.img = null; c.iz = 1; c.ix = 0; c.iy = 0;
    save(); render();
    return true;
  }
  if(panMoved) return true;                                 // 사진을 끌고 난 직후의 클릭은 무시
  const slot = e.target.closest(".slot.face");
  if(slot && slot.classList.contains("empty")){
    pickImage(slot.dataset.slot);
    return true;
  }
  return false;
}

  const inp = e.target.closest(".chipedit");

  const wrap = inp.closest(".chips");

/* ─── 인물 사진: 끌어서 이동 · 휠로 확대 ─────────────────── */
function applyFace(side){
  const c = pair()[side];
  const img = document.querySelector('.slot.face[data-slot="' + side + '"] img');
  if(img) img.style.cssText = panStyle(c);
}
let pan = null, panMoved = false;
document.addEventListener("pointerdown", e => {
  const slot = e.target.closest(".slot.face");
  if(!slot || slot.classList.contains("empty") || e.target.closest(".tools")) return;
  const side = slot.dataset.slot;
  pan = {side:side, x:e.clientX, y:e.clientY, ix:pair()[side].ix, iy:pair()[side].iy};
  panMoved = false;
  slot.classList.add("grabbing");
  try{ slot.setPointerCapture(e.pointerId); }catch(err){}
});
document.addEventListener("pointermove", e => {
  if(!pan) return;
  const dx = e.clientX - pan.x, dy = e.clientY - pan.y;
  if(Math.abs(dx) + Math.abs(dy) > 3) panMoved = true;
  const c = pair()[pan.side];
  c.ix = pan.ix + dx; c.iy = pan.iy + dy;
  applyFace(pan.side);
});
document.addEventListener("pointerup", () => {
  if(!pan) return;
  const slot = document.querySelector('.slot.face[data-slot="' + pan.side + '"]');
  if(slot) slot.classList.remove("grabbing");
  pan = null;
  if(panMoved){ save(); setTimeout(() => { panMoved = false; }, 0); }
});
document.addEventListener("wheel", e => {
  const slot = e.target.closest(".slot.face");
  if(!slot || slot.classList.contains("empty")) return;
  e.preventDefault();
  const side = slot.dataset.slot, c = pair()[side];
  c.iz = clamp(c.iz * (1 - e.deltaY * 0.0015), .4, 4);
  applyFace(side);
  const z = document.querySelector('[data-zoom="' + side + '"]');
  if(z){ z.value = c.iz; z.style.setProperty("--p", zoomPct(c.iz)); }
  save();
}, {passive:false});
document.addEventListener("dblclick", e => {          // 두 번 누르면 원위치
  const slot = e.target.closest(".slot.face");
  if(!slot || slot.classList.contains("empty")) return;
  const c = pair()[slot.dataset.slot];
  c.iz = 1; c.ix = 0; c.iy = 0;
  save(); render();
});

let pickTarget = null;
function pickImage(target){ pickTarget = target; $("#picker").click(); }
$("#picker").addEventListener("change", e => {

  shrink(f, maxW, data => {

      uni().cover = data;
    }else if(target.indexOf("blk:") === 0){
      const b = blockById(target.slice(4));
      if(b){ b.img = data; b.iz = 1; b.ix = 0; b.iy = 0; }
    }else{
      const c = pair()[target];
      c.img = data; c.iz = 1; c.ix = 0; c.iy = 0;
    }
    save(); render();
  });
});
function shrink(file, maxW, cb){
  const rd = new FileReader();
  rd.onload = () => {
    const im = new Image();
    im.onload = () => {
      const sc = Math.min(1, maxW / im.width);
      const w = Math.max(1, Math.round(im.width * sc)), h = Math.max(1, Math.round(im.height * sc));
      const cv = document.createElement("canvas");
      cv.width = w; cv.height = h;
      const g = cv.getContext("2d");
      g.fillStyle = "#FFFFFF";          // 투명한 그림은 흰 바탕 위에 얹는다
      g.fillRect(0, 0, w, h);
      g.drawImage(im, 0, 0, w, h);
      try{ cb(cv.toDataURL("image/jpeg", 0.82)); }
      catch(err){ cb(rd.result); }
    };
    im.onerror = () => notify("이 이미지는 읽을 수 없습니다");
    im.src = rd.result;
  };
  rd.readAsDataURL(file);
}
